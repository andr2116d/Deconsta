[project]
name = "control-de-pagos-server"
version = "0.1.0"
description = "API del sistema de control de pagos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "celery[redis]>=5.6.3",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.156.4",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "redis>=6.4.0",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.deptry]
known_first_party = ["app"]

[tool.deptry.per_rule_ignores]
# uvicorn se usa como servidor desde la línea de comandos, no se importa.
DEP002 = ["uvicorn"]
