# Producción en una sola instancia. Solo Caddy (client) publica puertos: 80 y 443.
name: deconsta

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: deconsta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: deconsta
      TZ: America/Lima
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deconsta -d deconsta"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: ./app/server
    image: deconsta-server
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Documentos de deudas (cola ocr) y vouchers de pago (cola pagos), cada uno con su worker: un
  # voucher nunca espera detrás de un recibo largo. Un proceso de PaddleOCR por archivo en curso.
  worker:
    image: deconsta-server
    restart: unless-stopped
    env_file: .env
    environment: &entorno_worker
      MIGRAR_AL_INICIAR: "false"
      OCR_PRECARGAR: "true"
      FORKED_BY_MULTIPROCESSING: "1"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      HOME: /home/app
    command: celery -A app.workers.celery_app:celery_app worker -n documentos@%h -Q ocr --concurrency=${OCR_CONCURRENCIA:-2} --loglevel=INFO
    volumes:
      - modelos_ocr:/home/app/.paddlex
    depends_on:
      server: { condition: service_started }

  worker-pagos:
    image: deconsta-server
    restart: unless-stopped
    env_file: .env
    environment: *entorno_worker
    command: celery -A app.workers.celery_app:celery_app worker -n pagos@%h -Q pagos --concurrency=${PAGOS_CONCURRENCIA:-2} --loglevel=INFO
    volumes:
      - modelos_ocr:/home/app/.paddlex
    depends_on:
      server: { condition: service_started }

  client:
    build:
      context: ./app
      dockerfile: client/Dockerfile
    image: deconsta-client
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO}
      API_UPSTREAM: server:8000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      server: { condition: service_started }

volumes:
  postgres_data:
  redis_data:
  modelos_ocr:
  caddy_data:
